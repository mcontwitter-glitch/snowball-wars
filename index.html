<!DOCTYPE html>

<title>BIG Entertainment Presents: Lil Foot's SnowBall Wars</title>
<style>
  html,body{margin:0;padding:0;background:#0d1524;height:100%;overflow:hidden;font-family:'Trebuchet MS','Verdana',sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{max-width:100vw;max-height:100vh;image-rendering:auto;border-radius:8px;box-shadow:0 0 60px rgba(120,200,255,.25);cursor:crosshair;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  #rot{display:none;position:fixed;top:12px;left:50%;transform:translateX(-50%);background:rgba(13,27,42,.8);color:#cfe6f5;padding:8px 14px;border-radius:10px;font-size:14px;z-index:10;pointer-events:none}
  #err{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(13,27,42,.95);color:#ffd76d;padding:16px 20px;border-radius:12px;font-size:15px;max-width:80vw;z-index:20;text-align:center;border:2px solid #ffd76d}
</style>
</head>
<body>
<div id="nojs" style="position:fixed;top:0;left:0;right:0;padding:12px;text-align:center;color:#fff;background:#c0392b;font-family:monospace;font-size:14px;z-index:99">&#9888;&#65039; If you can read this red bar, your network is blocking this page's code. Turn OFF cellular / switch to WiFi and reload. This bar disappears automatically when the game can run.</div>
<div id="wrap"><canvas id="game" width="1440" height="660"></canvas></div>
<div id="rot">&#128241; Tip: rotate to landscape for the full battlefield</div>
<div id="err"></div>
<script>
document.getElementById('nojs').style.display='none';
window.__GAME_BOOTED = false;
window.addEventListener('error', function(ev){
  var d = document.getElementById('err');
  if(d){ d.style.display='block'; d.textContent = 'Something went wrong: ' + (ev.message || 'unknown error') + '. Try updating your browser.'; }
});
setTimeout(function(){
  if(!window.__GAME_BOOTED){
    var d = document.getElementById('err');
    if(d && d.style.display==='none'){ d.style.display='block'; d.style.whiteSpace='pre'; d.textContent='STILL STARTING... report:\nbooted=' + window.__GAME_BOOTED + '\nimages=' + (window.IMAGES ? Object.keys(window.IMAGES).map(function(k){return k+':' + (window.IMAGES[k].ok?'ok':(window.IMAGES[k].errored?'ERR':'...'));}).join(',') : 'none'); }
  }
}, 4000);
</script>
<script>
// ================= v11 - SNOWCRAFT AUTHENTIC: faithful port of the 1999 Nicholson NY Lingo source =================
// gameplay: 5v5, drag-back slingshot, hits bury (3 = mound), rounds escalate,
// power-bird drops FLAMING (instant bury) & FROST (freeze rivals) orbs,
// rolling snow terrain with real ball-ground collision.
const SELFTEST = /[?&]selftest=1/.test(location.search);
const SPRITE_V = 'v33'; // cache-bust: force every device to pull fresh faces
const SPRITES = {
  hat:   'sprite_hat.png?'+SPRITE_V,
  crown: 'sprite_crown.png?'+SPRITE_V,
  scarf: 'sprite_scarf.png?'+SPRITE_V,
  lilfoot3: 'sprite_lilfoot3.png?'+SPRITE_V,
  whitey: 'sprite_whitey.png?'+SPRITE_V,
  green: 'sprite_green.png?'+SPRITE_V,
  bigfoot:'sprite_bigfoot.png?v26',
  title_green:  'title_green.png?'+SPRITE_V    // v33: title card cast (green kids pre-rendered; trio uses the real in-game sprites)
};
const IMAGES = {};
const SPRITE_KEYS = Object.keys(SPRITES);
let bootTried = false;
function tryBoot(){ if(bootTried) return; bootTried = true; boot(); }
SPRITE_KEYS.forEach(k => {
  const img = new Image();
  img.ok = false;
  img.onload = () => { img.ok = true; if(SPRITE_KEYS.every(x=>IMAGES[x].ok)) tryBoot(); };
  if(img.complete && img.naturalWidth) { img.ok = true; if(SPRITE_KEYS.every(x=>IMAGES[x].ok || IMAGES[x].errored)) tryBoot(); }
  img.onerror = () => { img.errored = true; if(SPRITE_KEYS.every(x=>IMAGES[x].ok || IMAGES[x].errored)) tryBoot(); };
  img.src = SPRITES[k];
  IMAGES[k] = img;
});
setTimeout(tryBoot, 3500); // mobile fallback: never hang on image decode

const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const FILTER_OK = (typeof ctx.filter === 'string');
const W = 1440, H = 660, G = 0.42;
const STAMP = SELFTEST ? 'v33 TEST' : 'v33';

// ---------- terrain (rolling snow banks, lake valley in middle) ----------
const GROUND_Y = 450;
const TPTS = [[0,GROUND_Y],[180,GROUND_Y],[360,GROUND_Y],[540,GROUND_Y],[720,GROUND_Y],[900,GROUND_Y],[1080,GROUND_Y],[1260,GROUND_Y],[1440,GROUND_Y]]; // Mau5: flat plane like the original
// original stage 594x322 scaled to 1440x660; ball slope tuned to this field's tilt (slope .16):
// a power-5 ball from the front line lands in the rival cluster, power 8 overshoots, like the source's tuning
const BALL_DX = 62.5, BALL_DY = 0; // flat field: level lobs, power = range (source had no gravity)
const MOUNDS = [90,650,790,1350].map(x=>({x, w:140, h:96})); // Mau5's card (Oct 8): two mounds on EACH side - one beyond each squad + one inboard bracket, all four visible // Mau5 (Oct 8): single-screen flat side-view arena with FOUR snowdrift obstacles, two per side of center
function moundSurface(x){ // drift profile: parabola spanning [x-w, x+w], apex h at center
  for(const m of MOUNDS){ const dx = Math.abs(x-m.x); if(dx < m.w) return terrainY(x) - m.h*(1-(dx/m.w)*(dx/m.w)); }
  return null;
}
function fenceX(y){ return 1551.5 - 2.3652*y; } // the source's movement fence: locH >= (320-locV)*2, scaled
function clampRed(k){ k.x = Math.max(Math.min(k.x, W-50), fenceX(k.feet));
  const ty = terrainY(k.x); k.feet = Math.max(ty-80, Math.min(ty+12, k.feet)); k.y = k.feet-30; }
function clampGreen(k){ k.x = Math.max(Math.min(k.x, W-60), 60);
  const ty = terrainY(k.x); k.feet = Math.max(ty-80, Math.min(ty+12, k.feet)); k.y = k.feet-30; }
function terrainY(x){
  const n = TPTS.length-1, fx = Math.max(0, Math.min(W, x)) / W * n;
  const i = Math.min(n-1, Math.floor(fx)), t = fx - i;
  const s = (1 - Math.cos(t*Math.PI))/2; // smooth cosine blend
  return TPTS[i][1]*(1-s) + TPTS[i+1][1]*s;
}

// ---------- audio ----------
let AC = null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(f0,f1,dur,type,vol){ const ac=audio(); if(!ac) return;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,ac.currentTime); o.frequency.exponentialRampToValueAtTime(f1,ac.currentTime+dur);
  g.gain.setValueAtTime(vol,ac.currentTime); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
  o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+dur+.02); }
function sfxThrow(){ tone(680,140,.22,'sine',.14); }
function sfxHit(){ tone(220,60,.18,'triangle',.3); }
function sfxBuried(){ [392,330,262].forEach((f,i)=>{ tone(f,f,.28,'sine',.14); }); }
function sfxDown(){ tone(180,90,.3,'sawtooth',.18); }
function sfxWin(){ [523,659,784,1047].forEach((f,i)=>{ tone(f,f,.2,'square',.09); }); }
function sfxBird(){ tone(1200,700,.09,'square',.06); tone(1400,900,.09,'square',.05); }
function sfxPower(){ [660,880,1320].forEach((f,i)=>{ tone(f,f,.18,'triangle',.1); }); }
function sfxFreeze(){ tone(1800,2400,.35,'sine',.08); tone(2400,3200,.3,'sine',.05); }
function sfxRoar(){ tone(150,55,.6,'sawtooth',.3); tone(95,42,.75,'square',.16); }
function sfxMega(){ tone(520,80,.32,'sawtooth',.24); }
function startBigfoot(){ bf={t:0, phase:'rise', x:1360, thrown:0}; streak=0; }

// ---------- entities: faithful port of the 1999 SnowCraft Lingo source ----------
// RED = your 3 kids, 2 hits each. GREEN = rival wave, 3 hits each (ow -> down -> dead).
// You drag a kid & hold to charge power 0-8; release lobs a fixed-slope snowball (distance = power).
const ASP = { hat:.653, whitey:.453, crown:.658, green:.78 };
function mkKid(key, x, team, tint, sc){
  const feet = terrainY(x);
  return { key, x, feet, y:feet-30, w:50*sc*(ASP[key]||.68), h:50*sc, sc, team, tint, dz:0,
           hits:0, maxHits: team==='p'?2:3,
           state:'ready', stateT:0, clock:Math.random(), walkDir:0, walkSteps:0,
           face:1, alive:true, squash:0, bobT:Math.random()*6.28 }; // green art natively faces the reds — never mirror it. reds use left-facing art (Mau5, Oct 7: all three face the rivals)
}
let kids=[], balls=[], parts=[], flakes=[], shake=0, state='title', time=0;
let level=1, score=0, levelKills=0, winner=null, bannerT=0, celebrate=0;
let streak=0; const STREAK_GOAL=10; let bf=null;   // Mau5's idea: 10 hits in a row = Lil Foot power-up
let hold=null; // {kid, t0}
const lastMouse={x:-1,y:-1};
function greensPerLevel(L){ return Math.min(12, 1+2*L); } // 3,5,7,9,11,12,12...
function reds(){ return kids.filter(k=>k.team==='p'); }
function greens(){ return kids.filter(k=>k.team==='e'); }
function reset(){
  kids=[]; balls=[]; parts=[]; winner=null; shake=0; celebrate=0; levelKills=0; hold=null; streak=0; bf=null;
  const pk=['hat','whitey','crown'], psc=[1.64,1.54,1.61]; // Mau5: match his screenshot size (~12% height, 'same size characters as well')
  [1245,1125,1000].forEach((x,i)=>{ const k=mkKid(pk[i], x, 'p', 0, psc[i]); k.dz=[0,8,3][i]; k.feet+=k.dz; k.y=k.feet-30; kids.push(k); }); // trio spread like the screenshot, 50yd gap holds
  const gd = greensPerLevel(level);
  // reference formation: tight staggered cluster on the upper-left slope (2 back + 1 front for the opening trio)
  const gSlots = [];
  for(let i=0;i<gd;i++){
    if(i<4) gSlots.push({x:265+i*115, sc:[1.56,1.5,1.53,1.56][i], back:0});          // front line, screenshot size — 50 yards (500px) from the red line
    else    gSlots.push({x:210+((i-4)%4)*115 + Math.floor((i-4)/4)*57, sc:1.34, back:1}); // back band, up-slope stagger like the screenshot
  }
  gSlots.sort((a,b)=> (a.back-b.back) || (a.x-b.x));   // back band drawn first, each band up-slope first
  for(const g of gSlots){ const k=mkKid('green', g.x, 'e', 0, g.sc); if(g.back){ k.dz=-34; k.feet+=k.dz; k.y=k.feet-30; } kids.push(k); } // back band stands a touch up-screen = depth, flat field otherwise
  flakes = Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.6,v:.4+Math.random()*1.2,drift:Math.random()*6.28}));
}
function kidFeet(k){ k.feet = terrainY(k.x) + (k.dz||0); k.y = k.feet-30; }
function throwBall(k, power){
  const dir = k.team==='p' ? -1 : 1;
  // source: the ball spawns AT the kid's sprite loc - aim is where you park the kid
  balls.push({x:k.x+dir*8, y:k.feet-k.h*.45, dir, from:k.team, power,
              phase:'rise', steps:power*2, dropSteps:10, r:11+power*1.5, spin:Math.random()*6, t:0});
  k.state='toss'; k.stateT=5;
  if(power>=8){ tone(920,180,.25,'sine',.2); } else { sfxThrow(); } // source: "Whoosh" only for the range-16 ball
}
function hittable(k){
  // source: greens skip when memberNum > "G recover" = the down/lying + mound members only
  return k.alive && k.state!=='down';
}
function kidHit(k, b){
  k.squash=1; shake=7; sfxHit(); poof(b.x,b.y,12);
  // streak: consecutive landed hits with your balls (mega balls don't count)
  if(k.team==='e' && b && b.from==='p'){ streak++;
    if(streak>=STREAK_GOAL && !bf && greens().some(g=>g.alive)) startBigfoot(); }
  if(k.team==='p') streak=0;
  // source: a ball on a held red interrupts the drag (the stillDown loop exits when memberNum >= "R hit")
  if(k.team==='p'){ if(hold && hold.kid===k) hold=null; }
  // re-hit during the stagger just restarts the flinch - it does not stack (re-setting member "G hit")
  if(k.state==='hit' || k.state==='hit2'){ k.state='hit'; k.stateT=1; return; }
  // "myMove" left over from the interrupted state delays when the hit registers ("hit2" waits myMove=0)
  k.hitPend = (k.team==='p' && k.state==='cock') ? 0
            : (k.state==='walk') ? Math.min(k.walkSteps,30)
            : Math.min(Math.max(0,Math.ceil(k.stateT)),30);
  k.state='hit'; k.stateT=1;
}

// ---------- input: drag kid + hold to charge ----------
function pos(e){ const r=cv.getBoundingClientRect();
  const t = (e.changedTouches && e.changedTouches[0]) || (e.touches && e.touches[0]) || e;
  return { x:(t.clientX-r.left)*(W/r.width), y:(t.clientY-r.top)*(H/r.height) }; }
function down(e){ if(state!=='play') return; const p=pos(e);
  if(hold){ e.preventDefault(); return; }              // one held kid at a time, like the source
  let best=null, bd=130;
  for(const k of reds()){ if(!k.alive || k.state==='hit' || k.state==='hit2') continue;
    const d=Math.hypot(p.x-k.x, p.y-(k.y-k.h*.3));
    if(d<bd){ bd=d; best=k; } }
  if(best){ hold={kid:best, t0:time, ox:p.x-best.x, oy:p.y-best.feet}; best.state='cock'; best.stateT=999; actKid=best; }
  e.preventDefault(); }
function move(e){ const p=pos(e); lastMouse.x=p.x; lastMouse.y=p.y;
  if(!hold) return;
  const k=hold.kid;
  k.x = p.x-hold.ox; k.feet = p.y-hold.oy; clampRed(k);  // source: full 2D drag + the diagonal fence
  e.preventDefault(); }
function up(e){ if(!hold) return;
  const power = Math.max(0, Math.min(8, Math.floor((time-hold.t0)*12)));
  const k=hold.kid; hold=null;
  if(k.state==='cock') throwBall(k, power);  // source throws even at power 0 - the ball just melts at the kid
  e.preventDefault(); }

// ---------- mobile input: same drag mechanic as desktop, finger directly on the kid ----------
// (Mau5: no joystick, no FIRE button - press a kid, drag in any direction, release to throw)
let actKid=null;

cv.addEventListener('mousedown',click); cv.addEventListener('mousedown',down); cv.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
cv.addEventListener('touchstart',click,{passive:false}); cv.addEventListener('touchstart',down,{passive:false}); cv.addEventListener('touchmove',move,{passive:false}); cv.addEventListener('touchend',up);
cv.addEventListener('click',click);

function click(e){ const p=pos(e);
  if(state==='title'){ startGame(); return; }
  if(state==='end'){ if(p.x>W/2-110&&p.x<W/2+110&&p.y>H-116&&p.y<H-72){ level=1; score=0; startGame(); } } }
function startGame(){ state='play'; audio(); try{ if(AC && AC.state==='suspended') AC.resume(); }catch(err){}
  reset(); const rot=document.getElementById('rot'); if(rot) rot.style.display='none'; }

// ---------- green AI: the original random(10) state machine ----------
function redTick(k){   // source red script: no idle behavior - only hit/daze states tick
  if(k.stateT>0){ k.stateT--; if(k.stateT>0) return; }
  switch(k.state){
    case 'toss': k.state='ready'; break;
    case 'daze': k.state='ready'; break;            // 15 steps of the 3-frame wobble (drawn at 12/s)
    case 'hit': k.state='hit2'; k.stateT=Math.max(0,k.hitPend||0); break;
    case 'hit2':
      k.hits++;
      if(k.hits>=k.maxHits){ k.alive=false; k.state='dead'; sfxBuried(); explodeKid(k); }
      else { k.state='daze'; k.stateT=45; sfxBird(); }   // source: bird_tweets; mySteps=15 decrements once per FULL daze1->daze2->daze3 cycle (1 tick each), so 15 x 3 = 45 ticks = 3.75s
      break;
  }
}
function greenAI(k, ticks){
  k.clock += ticks;
  while(k.clock >= 5){ k.clock -= 5; greenTick(k); }
}
function greenTick(k){
  if(k.stateT>0){ k.stateT--; if(k.stateT>0) return; }
  switch(k.state){
    case 'ready': {
      const roll = Math.random()*10;
      if(roll<1){        // case 1: long V-walk, myMove=random(99), direction point(2,1) or (-2,-1)
        k.state='walk'; k.walkKind='V'; k.walkSteps=1+Math.floor(Math.random()*99);
        const s=Math.random()<.5?1:-1; k.dx=4.85*s; k.dy=2.05*s;
      } else if(roll<2){ // case 2: short H-walk, myMove=5, direction point(1,2) or (-1,-2)
        k.state='walk'; k.walkKind='H'; k.walkSteps=5;
        const s=Math.random()<.5?1:-1; k.dx=2.42*s; k.dy=4.10*s;
      } else if(roll<4){ k.state='windup'; k.stateT=5; } // cases 3-4
      break; }          // cases 5-10: stand ready
    case 'walk': {
      if(k.x<97){ k.dx=9.7; k.dy=2.05; }     // source step(): locH<40 -> point(4,1)
      if(k.feet<82){ k.dx=2.42; k.dy=8.2; }  // source step(): locV<40 -> point(1,4)
      k.x+=k.dx; k.feet+=k.dy; clampGreen(k);
      k.walkSteps--;
      if(k.x > fenceX(k.feet)){ k.state='windup'; k.stateT=5; }      // crossed the fence: set up the throw
      else if(k.walkSteps<=0){ if(k.walkKind==='V'){ k.state='windup'; k.stateT=5; } else { k.state='ready'; } }
      break; }
    case 'windup': k.state='cock'; k.stateT=6+Math.floor(Math.random()*10); break; // source: random(10)+5 = 6-15
    case 'cock':
      throwBall(k, 5+Math.floor(Math.random()*4)); // original: random(4)+4
      break;
    case 'toss': k.state='ready'; break;
    case 'walk':
      k.x += k.walkDir*3.2;
      if(k.x > W-60) k.walkDir = -1;
      if(k.x < 60) k.walkDir = 1;
      if(k.x > 660){ k.state='windup'; k.stateT=5; }   // reached the line: set up to throw
      kidFeet(k);
      k.walkSteps--;
      if(k.walkSteps<=0 || Math.random()<.05) k.state='ready';
      break;
    case 'ow': k.state='recover'; k.stateT=5; break;
    case 'recover': k.state='ready'; break;
    case 'down': k.state='ow'; k.stateT=5; break;   // source: "G down" -> "G ow" after 5
    case 'hit': k.state='hit2'; k.stateT=Math.max(0,k.hitPend||0); break;
    case 'hit2':
      k.hits++;
      if(k.hits>=k.maxHits){ k.alive=false; k.state='dead'; levelKills++; sfxBuried(); explodeKid(k); }
      else if(k.hits===2){ k.state='down'; k.stateT=25; sfxDown(); }   // source: hit2 sound, down 25
      else { k.state='ow'; k.stateT=10; }
      break;
    case 'daze': k.state='ready'; break;
  }
}

// ---------- update ----------
let flashMsg='', flashT=0, selfT=0;
function flash(m){ flashMsg=m; flashT=2.2; }
function update(dt){
  time+=dt;
  for(const f of flakes){ f.y+=f.v; f.x+=Math.sin(time*.8+f.drift)*.3; if(f.y>H){f.y=-4;f.x=Math.random()*W;} }
  flashT=Math.max(0,flashT-dt);
  shake=Math.max(0,shake-dt*30);
  if(state==='banner'){ bannerT-=dt; if(bannerT<=0){ state='play'; } return; }
  if(state==='celebrate'){ celebrate-=dt;
    if(bf){ bf.t+=dt; if(bf.phase!=='sink' && bf.t>0.5){ bf.phase='sink'; bf.t=0; }
      else if(bf.phase==='sink' && bf.t>=0.9){ bf=null; } }
    for(const k of greens()) k.bobT += dt*6;
    if(celebrate<=0){ if(level>=11){ winner='p'; state='end'; return; }
      level++; reset(); state='banner'; bannerT=1.6; }
    return; }
  if(state!=='play') return;
  for(const k of kids){ k.bobT+=dt*3; k.squash=Math.max(0,k.squash-dt*4); }
  // kid ticks (every 5/60 s), ball ticks (every 2/60 s) — discrete like the original
  const kidTicks = dt*60, ballTicks = dt*60;
  for(const k of greens()){ if(k.alive) greenAI(k, kidTicks); }
  for(const k of reds()){ if(!k.alive) continue; k.clock += kidTicks;
    while(k.clock >= 5){ k.clock -= 5; redTick(k); } }
  // source flight: a straight diagonal. "snowball" moves (20,10)/2ticks for power*2 steps
  // (hits only while myRange>0), then the drop/splat/melt members keep flying at HALF speed
  // while the ball shrinks away. No gravity, no ground: aim = kid placement, power = range.
  for(const b of balls){
    if(b.phase!=='drop'){ ctx.fillStyle='rgba(120,130,142,.16)'; ctx.beginPath(); ctx.ellipse(4, b.r*.55, b.r*1.05, b.r*.30, 0, 0, 7); ctx.fill(); }
    if(b.mega){ // Lil Foot mega snowball: buries ANY rival it touches, even a downed one
      b.x += b.vx*dt; b.y += b.vy*dt; b.trail -= dt;
      if(b.trail<=0){ b.trail=.03; parts.push({x:b.x+(Math.random()-.5)*30,y:b.y+(Math.random()-.5)*30,vx:0,vy:-.5,r:3+Math.random()*6,life:.9}); }
      for(const k of greens()){ if(!k.alive) continue;
        if(Math.hypot(b.x-k.x, b.y-(k.feet-k.h*.5)) < b.r+34){
          k.alive=false; k.state='dead'; levelKills++; sfxBuried(); explodeKid(k,26); shake=Math.max(shake,10); } }
      if(b.x<-120||b.x>W+120) b.dead=true;
      continue; }
    b.t += ballTicks;
    while(b.t >= 2){
      b.t -= 2;
      if(b.phase==='rise'){
        if(b.steps<=0){ b.phase='drop'; if(b.from==='p') streak=0; }  // a miss breaks the streak
        else {
          b.x += b.dir*BALL_DX; b.y += b.dir*BALL_DY; b.steps--; b.spin+=.4;
          const ms = moundSurface(b.x);           // snowdrift obstacles: the ball rides up and over like the source's rolling balls
          if(ms!==null && b.y > ms - b.r*.4){
            if(!b.wasMound){ poof(b.x, ms-6, 4); b.wasMound = 1; } else b.wasMound = 0;
            b.y = ms - b.r*.4;

  // carried orb
  const oc = bird.type==='flame' ? 'rgba(255,140,40,.85)' : 'rgba(255,230,90,.85)';
  ctx.shadowColor=oc; ctx.shadowBlur=12; ctx.fillStyle=oc;
  ctx.beginPath(); ctx.arc(0,12,7,0,7); ctx.fill(); ctx.shadowBlur=0;
  ctx.restore();
  for(const d of drops){
    ctx.save(); ctx.translate(d.x,d.y);
    const c = d.type==='flame' ? '#ff9640' : '#ffe65a';
    ctx.shadowColor=c; ctx.shadowBlur=14; ctx.fillStyle=c;
    ctx.beginPath(); ctx.arc(0,0,9,0,7); ctx.fill(); ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(-3,-3,3,0,7); ctx.fill();
    ctx.restore();
  }
}

function drawDragUI(){ // Mau5: highlight circle around the selected kid + power meter in that circle
  if(!hold || state!=='play') return;
  const k = hold.kid; if(!k.alive) return;
  const pw = Math.max(0, Math.min(8, Math.floor((time-hold.t0)*12)));  // same charge rate as up()
  const kidH = 126*k.sc, r = kidH*.58, cy = k.feet - kidH/2;            // ring wraps the character
  const col = pw>=8 ? '#ff5d5d' : pw>=6 ? '#ffb14d' : pw>=3 ? '#ffe98a' : '#7fff9e';
  ctx.save(); ctx.translate(k.x, cy);
  // selection highlight ring
  ctx.strokeStyle='rgba(255,255,255,.55)'; ctx.lineWidth=2.5;
  ctx.setLineDash([7,7]);
  ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.stroke(); ctx.setLineDash([]);
  // power meter: speedometer arc inside the ring (opens at the bottom)
  const a0 = Math.PI*.75;
  ctx.strokeStyle='rgba(13,27,42,.45)'; ctx.lineWidth=7; ctx.lineCap='round';
  ctx.beginPath(); ctx.arc(0,0,r-8,a0,a0+Math.PI*1.5); ctx.stroke();
  if(pw>0){ ctx.strokeStyle=col;
    ctx.beginPath(); ctx.arc(0,0,r-8,a0,a0+(pw/8)*Math.PI*1.5); ctx.stroke();
    if(pw>=8){ ctx.shadowColor=col; ctx.shadowBlur=16; ctx.stroke(); ctx.shadowBlur=0; } }
  // power readout in the circle's bottom gap
  const py = r-8;
  ctx.fillStyle='rgba(13,27,42,.78)'; ctx.fillRect(-25,py-9,50,18);
  ctx.strokeStyle=col; ctx.lineWidth=1; ctx.strokeRect(-25,py-9,50,18);
  ctx.fillStyle=col; ctx.font='bold 13px "Trebuchet MS",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(pw+' / 8', 0, py+.5);
  ctx.restore(); }

function drawSnow(){ ctx.fillStyle='rgba(178,192,206,.8)';
  for(const f of flakes){ ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,7); ctx.fill(); } }
function bigText(txt,y,size,fill){ ctx.font=`bold ${size}px 'Trebuchet MS',sans-serif`;
  ctx.textAlign='center'; ctx.lineWidth=8; ctx.strokeStyle='rgba(13,27,42,.8)';
  ctx.strokeText(txt,W/2,y); ctx.fillStyle=fill; ctx.fillText(txt,W/2,y); }
function drawTitle(){
  // Mau5's spec: 1998 SnowCraft title card — fixed diagonal-down camera, one flat white snow arena,
  // no sky, no trees, no UI. Lots of empty space, cool blue vignette at the edges.
  ctx.fillStyle='#fcfdff'; ctx.fillRect(0,0,W,H);
  for(let i=0;i<26;i++){                     // faint snow unevenness, deterministic
    const bx=(i*97.3+31)%W, by=(i*61.7+17)%H, br=26+(i*29)%70;
    const g=ctx.createRadialGradient(bx,by,0,bx,by,br);
    g.addColorStop(0,'rgba(198,220,240,.10)'); g.addColorStop(1,'rgba(198,220,240,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(bx,by,br,br*.6,0,0,7); ctx.fill();
  }
  const vg=ctx.createRadialGradient(W/2,H/2,H*.34, W/2,H/2,W*.60);
  vg.addColorStop(0,'rgba(148,178,208,0)'); vg.addColorStop(.72,'rgba(148,178,208,.08)'); vg.addColorStop(1,'rgba(148,178,208,.30)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);
  // centered title, classic serif, medium dark blue-gray
  ctx.textAlign='center';
  ctx.font='52px Georgia, "Times New Roman", serif';
  ctx.fillStyle='#46586e';
  ctx.fillText("Season's Greetings", W/2, 168);
  // two lumpy kidney snowdrifts — one left of center, one lower center-right
  kidney(618, 442, 152, 46, 3);
  kidney(882, 542, 170, 52, 7);
  // green kids: two near the upper left, one lower left
  tsprite('title_green', 200, 292);
  tsprite('title_green', 334, 260);
  tsprite('title_green', 242, 512);
  // the three lil foots — Mau5's actual characters: whitey higher right, MC's crown kid + BudE's hardhat kid lower and spaced apart
  tsprite('whitey', 1160, 262);
  tsprite('crown', 1008, 552);
  tsprite('hat', 1274, 524);
  ctx.font='italic 17px Georgia, serif'; ctx.fillStyle='rgba(70,88,110,.55)';
  ctx.fillText('click to play', W/2, 628);
  ctx.font='11px sans-serif'; ctx.fillStyle='rgba(70,88,110,.45)'; ctx.textAlign='right';
  ctx.fillText(STAMP, W-10, H-8);
}
function tsprite(key, x, footY){
  const im = IMAGES[key]; if(!im || !im.ok) return;
  const h = 118, w = im.width*(h/im.height);
  const g=ctx.createRadialGradient(x+14, footY+7, 0, x+14, footY+7, 46);   // soft shadow to the lower right
  g.addColorStop(0,'rgba(110,140,172,.36)'); g.addColorStop(1,'rgba(110,140,172,0)');
  ctx.fillStyle=g; ctx.beginPath(); ctx.ellipse(x+14, footY+7, 46, 13, 0, 0, 7); ctx.fill();
  ctx.drawImage(im, x-w/2, footY-h, w, h);
}
function kidney(cx, cy, w, h, seed){
  // lumpy kidney-shaped snowdrift: raised white lump — ground shadow, bumpy union of circles,
  // dent in the top edge, blue-gray shading on the UNDERSIDE only
  const R=(n)=>{ const v=Math.sin(seed*99+n*37.7)*43758.5; return v-Math.floor(v); };
  const sh=ctx.createRadialGradient(cx, cy+h*.62, 0, cx, cy+h*.62, w*.62);
  sh.addColorStop(0,'rgba(105,135,168,.26)'); sh.addColorStop(1,'rgba(105,135,168,0)');
  ctx.fillStyle=sh; ctx.beginPath(); ctx.ellipse(cx, cy+h*.62, w*.62, h*.42, 0, 0, 7); ctx.fill();
  const N=9;
  ctx.save();
  ctx.beginPath();
  for(let i=0;i<N;i++){
    const t=i/(N-1);
    let bx=cx-w/2+t*w, by=cy - Math.sin(t*Math.PI)*h*(.55+.45*R(i)), br=h*(.34+.30*R(i+9));
    if(i===4){ by=cy-h*.16; br=h*.20; }        // kidney dent: middle bump sinks
    ctx.moveTo(bx+br,by); ctx.arc(bx,by,br,0,7);
  }
  ctx.fillStyle='#feffff'; ctx.fill();
  ctx.globalCompositeOperation='source-atop'; // below clips to the blob
  const ug=ctx.createLinearGradient(0, cy+h*.18, 0, cy+h*.95);
  ug.addColorStop(0,'rgba(146,172,200,0)'); ug.addColorStop(1,'rgba(146,172,200,.48)');
  ctx.fillStyle=ug; ctx.fillRect(cx-w*.6, cy, w*1.2, h*1.6);   // underside band only
  ctx.restore();
}
function drawBanner(){
  ctx.fillStyle='rgba(10,18,34,.35)'; ctx.fillRect(0,0,W,H);
  bigText('LEVEL '+level, 250, 72, '#ffd76d');
  ctx.font="italic 22px 'Trebuchet MS',sans-serif"; ctx.textAlign='center'; ctx.fillStyle='#e6f2fa';
  ctx.fillText(level===1 ? 'Drag a kid, HOLD to power up, release to throw.' : (greensPerLevel(level)+' rivals incoming.'), W/2, 320);
}
function drawEnd(){
  // the original's ending card: Season's Greetings (GreenWin scene)
  const win = winner==='p';
  ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#eef6fa';                       // pale distant hills
  ctx.beginPath(); ctx.ellipse(W*.22, 575, 520, 140, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(W*.78, 575, 580, 165, 0, 0, 7); ctx.fill();
  function mound(x,y,w,h){ ctx.fillStyle='#d6e9f0'; ctx.beginPath();
    ctx.ellipse(x,y,w,h,0,Math.PI,Math.PI*2,false); ctx.closePath(); ctx.fill();
    ctx.strokeStyle='#bcd8e4'; ctx.lineWidth=3; ctx.stroke(); }
  function sit(key,x,y,s,flip,tilt,onMound){
    const img=IMAGES[key]; if(!img||!img.ok) return;
    const h=112*s, w=h*(img.width/img.height);
    if(onMound) mound(x, y+18, w*.66, 30*s);
    ctx.save(); ctx.translate(x,y); ctx.rotate(tilt||0); if(flip) ctx.scale(-1,1);
    ctx.drawImage(img, -w/2, -h*.9, w, h*.85); ctx.restore(); }   // squashed read = sitting
  // cast, mirroring the original card: winners sit on the snow, the beaten squad sits around the mounds
  const winKeys = win ? ['hat','whitey','crown'] : ['green','green','green'];
  const loseKeys = win ? ['green','green','green'] : ['hat','whitey','crown'];
  sit(winKeys[0], 235, 305, 1.15, false, -.05, false);
  sit(winKeys[1], 335, 292, 1.05, false, .05, false);
  sit(winKeys[2], 252, 472, 1.18, true, .03, false);
  sit(loseKeys[0], 1062, 305, 1, true, -.04, true);
  sit(loseKeys[1], 1172, 295, .95, false, .06, true);
  sit(loseKeys[2], 1116, 470, 1.05, false, -.02, true);
  ctx.textAlign='center';                        // watercolor-feel double render of the lettering
  ctx.font="italic 80px Georgia, 'Times New Roman', serif";
  ctx.fillStyle='rgba(43,77,102,.30)'; ctx.fillText("Season's Greetings", W/2+2, 214);
  ctx.fillStyle='#2b4d66'; ctx.fillText("Season's Greetings", W/2, 210);
  ctx.font="italic 24px Georgia, serif"; ctx.fillStyle='rgba(43,77,102,.9)';
  ctx.fillText(win ? 'You buried the whole mountain. Legendary. From Lil Foots with love.'
                   : 'The rival squad sends their regards. From Lil Foots with love.', W/2, 262);
  ctx.font="bold 22px 'Trebuchet MS',sans-serif"; ctx.fillStyle='rgba(43,77,102,.95)';
  ctx.fillText('FINAL SCORE '+score+'   •   LEVEL '+level+(win?' CLEARED':' REACHED'), W/2, 308);
  ctx.fillStyle='rgba(43,77,102,.08)'; ctx.strokeStyle='#2b4d66'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.rect(W/2-110,H-116,220,44); ctx.fill(); ctx.stroke();
  ctx.font="bold 26px 'Trebuchet MS',sans-serif"; ctx.fillStyle='#2b4d66'; ctx.fillText('REMATCH', W/2, H-85);
}
function drawHUD(){
  if(state!=='play' && state!=='banner' && state!=='celebrate') return;
  ctx.font="bold 18px 'Trebuchet MS',sans-serif"; ctx.textAlign='left'; ctx.fillStyle='rgba(13,27,42,.75)';
  ctx.fillText('LEVEL '+level, 24, 40);
  ctx.textAlign='center'; ctx.fillText('SCORE '+score, W/2, 40);
  ctx.textAlign='right'; ctx.fillText(greens().filter(k=>k.alive).length+' RIVALS LEFT', W-24, 40);
  if(streak>=3 && state==='play' && !bf){
    const pulse = streak>=9 ? 1+Math.sin(time*12)*.18 : 1;
    const sx=250, sy=34;
    ctx.save(); ctx.translate(sx,sy); ctx.scale(pulse,pulse);
    ctx.fillStyle='#ff7a2f'; ctx.beginPath();
    ctx.moveTo(0,-16); ctx.quadraticCurveTo(10,-6,6,4); ctx.quadraticCurveTo(3,9,0,12);
    ctx.quadraticCurveTo(-3,9,-6,4); ctx.quadraticCurveTo(-10,-6,0,-16); ctx.fill();
    ctx.fillStyle='#ffd23e'; ctx.beginPath();
    ctx.moveTo(0,-9); ctx.quadraticCurveTo(6,-2,3,4); ctx.quadraticCurveTo(0,7,0,7);
    ctx.quadraticCurveTo(-2,3,-3,4); ctx.quadraticCurveTo(-6,-2,0,-9); ctx.fill();
    ctx.fillStyle='rgba(13,27,42,.8)'; ctx.font="bold 19px 'Trebuchet MS',sans-serif";
    ctx.textAlign='left'; ctx.fillText('x'+streak, 14, 7);
    ctx.restore(); }
}
let last=0;
function loop(ts){
  const dt=Math.min(.033,(ts-last)/1000)||.016; last=ts;
  update(dt);
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  drawBG(); drawBigfoot(); for(const k of kids) drawFighter(k);
  drawBalls(); drawAim(); drawSnow(); drawDragUI();
  if(state==='title') drawTitle();
  if(state==='banner') drawBanner();
  if(state==='end') drawEnd();
  drawHUD();
  if(flashT>0 && state==='play'){ ctx.globalAlpha=Math.min(1, flashT);
    bigText(flashMsg, 118, 44, '#ffd76d'); ctx.globalAlpha=1; }
  ctx.restore();
  requestAnimationFrame(loop);
}
function boot(){ window.__GAME_BOOTED=true; reset(); requestAnimationFrame(loop); }
if(SELFTEST){ setTimeout(startGame, 500); }
if(/[?&]bf=1/.test(location.search)){
  const bfpoll = setInterval(()=>{ if(!window.__GAME_BOOTED) return;
    if(state==='title'){ startGame(); }
    else if(state==='play'){ startBigfoot(); clearInterval(bfpoll); } }, 400); }
</script>
