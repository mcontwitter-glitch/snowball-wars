<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>BIG Entertainment Presents: Lil Foot's SnowBall Wars</title>
<style>
  html,body{margin:0;padding:0;background:#0d1524;height:100%;overflow:hidden;font-family:'Trebuchet MS','Verdana',sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{max-width:100vw;max-height:100vh;image-rendering:auto;border-radius:8px;box-shadow:0 0 60px rgba(120,200,255,.25);cursor:crosshair;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  #rot{display:none;position:fixed;top:12px;left:50%;transform:translateX(-50%);background:rgba(13,27,42,.8);color:#cfe6f5;padding:8px 14px;border-radius:10px;font-size:14px;z-index:10;pointer-events:none}
  #err{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(13,27,42,.95);color:#ffd76d;padding:16px 20px;border-radius:12px;font-size:15px;max-width:80vw;z-index:20;text-align:center;border:2px solid #ffd76d}
</style>
</head>
<body>
<div id="nojs" style="position:fixed;top:0;left:0;right:0;padding:12px;text-align:center;color:#fff;background:#c0392b;font-family:monospace;font-size:14px;z-index:99">&#9888;&#65039; If you can read this red bar, your network is blocking this page's code. Turn OFF cellular / switch to WiFi and reload. This bar disappears automatically when the game can run.</div>
<div id="wrap"><canvas id="game" width="1440" height="660"></canvas></div>
<div id="rot">&#128241; Tip: rotate to landscape for the full battlefield</div>
<div id="err"></div>
<script>
document.getElementById('nojs').style.display='none';
window.__GAME_BOOTED = false;
window.addEventListener('error', function(ev){
  var d = document.getElementById('err');
  if(d){ d.style.display='block'; d.textContent = 'Something went wrong: ' + (ev.message || 'unknown error') + '. Try updating your browser.'; }
});
setTimeout(function(){
  if(!window.__GAME_BOOTED){
    var d = document.getElementById('err');
    if(d && d.style.display==='none'){ d.style.display='block'; d.style.whiteSpace='pre'; d.textContent='STILL STARTING... report:\nbooted=' + window.__GAME_BOOTED + '\nimages=' + (window.IMAGES ? Object.keys(window.IMAGES).map(function(k){return k+':' + (window.IMAGES[k].ok?'ok':(window.IMAGES[k].errored?'ERR':'...'));}).join(',') : 'none'); }
  }
}, 4000);
</script>
<script>
// ================= v11 - SNOWCRAFT AUTHENTIC: faithful port of the 1999 Nicholson NY Lingo source =================
// gameplay: 5v5, drag-back slingshot, hits bury (3 = mound), rounds escalate,
// power-bird drops FLAMING (instant bury) & FROST (freeze rivals) orbs,
// rolling snow terrain with real ball-ground collision.
const SELFTEST = /[?&]selftest=1/.test(location.search);
const SPRITE_V = 'v18'; // cache-bust: force every device to pull fresh faces
const SPRITES = {
  hat:   'sprite_hat.png?'+SPRITE_V,
  crown: 'sprite_crown.png?'+SPRITE_V,
  scarf: 'sprite_scarf.png?'+SPRITE_V,
  lilfoot3: 'sprite_lilfoot3.png?'+SPRITE_V,
  whitey: 'sprite_whitey.png?'+SPRITE_V,
  green: 'sprite_green.png?'+SPRITE_V
};
const IMAGES = {};
const SPRITE_KEYS = Object.keys(SPRITES);
let bootTried = false;
function tryBoot(){ if(bootTried) return; bootTried = true; boot(); }
SPRITE_KEYS.forEach(k => {
  const img = new Image();
  img.ok = false;
  img.onload = () => { img.ok = true; if(SPRITE_KEYS.every(x=>IMAGES[x].ok)) tryBoot(); };
  if(img.complete && img.naturalWidth) { img.ok = true; if(SPRITE_KEYS.every(x=>IMAGES[x].ok || IMAGES[x].errored)) tryBoot(); }
  img.onerror = () => { img.errored = true; if(SPRITE_KEYS.every(x=>IMAGES[x].ok || IMAGES[x].errored)) tryBoot(); };
  img.src = SPRITES[k];
  IMAGES[k] = img;
});
setTimeout(tryBoot, 3500); // mobile fallback: never hang on image decode

const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const FILTER_OK = (typeof ctx.filter === 'string');
const W = 1440, H = 660, G = 0.42;
const STAMP = SELFTEST ? 'v20 TEST' : 'v20';

// ---------- terrain (rolling snow banks, lake valley in middle) ----------
const TPTS = [[0,244],[180,252],[360,266],[540,286],[720,312],[900,344],[1080,382],[1260,424],[1440,470]];
function terrainY(x){
  const n = TPTS.length-1, fx = Math.max(0, Math.min(W, x)) / W * n;
  const i = Math.min(n-1, Math.floor(fx)), t = fx - i;
  const s = (1 - Math.cos(t*Math.PI))/2; // smooth cosine blend
  return TPTS[i][1]*(1-s) + TPTS[i+1][1]*s;
}

// ---------- audio ----------
let AC = null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function tone(f0,f1,dur,type,vol){ const ac=audio(); if(!ac) return;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type=type; o.frequency.setValueAtTime(f0,ac.currentTime); o.frequency.exponentialRampToValueAtTime(f1,ac.currentTime+dur);
  g.gain.setValueAtTime(vol,ac.currentTime); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);
  o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+dur+.02); }
function sfxThrow(){ tone(680,140,.22,'sine',.14); }
function sfxHit(){ tone(220,60,.18,'triangle',.3); }
function sfxBuried(){ [392,330,262].forEach((f,i)=>{ tone(f,f,.28,'sine',.14); }); }
function sfxWin(){ [523,659,784,1047].forEach((f,i)=>{ tone(f,f,.2,'square',.09); }); }
function sfxBird(){ tone(1200,700,.09,'square',.06); tone(1400,900,.09,'square',.05); }
function sfxPower(){ [660,880,1320].forEach((f,i)=>{ tone(f,f,.18,'triangle',.1); }); }
function sfxFreeze(){ tone(1800,2400,.35,'sine',.08); tone(2400,3200,.3,'sine',.05); }

// ---------- entities: faithful port of the 1999 SnowCraft Lingo source ----------
// RED = your 3 kids, 2 hits each. GREEN = rival wave, 3 hits each (ow -> down -> dead).
// You drag a kid & hold to charge power 0-8; release lobs a fixed-slope snowball (distance = power).
const ASP = { hat:.653, whitey:.453, crown:.658, green:.78 };
function mkKid(key, x, team, tint, sc){
  const feet = terrainY(x);
  return { key, x, feet, y:feet-30, w:50*sc*(ASP[key]||.68), h:50*sc, sc, team, tint,
           hits:0, maxHits: team==='p'?2:3,
           state:'ready', stateT:0, clock:Math.random(), walkDir:0, walkSteps:0,
           face: team==='p'?-1:1, alive:true, squash:0, bobT:Math.random()*6.28 };
}
let kids=[], balls=[], parts=[], flakes=[], shake=0, state='title', time=0;
let level=1, score=0, levelKills=0, winner=null, bannerT=0, celebrate=0;
let hold=null; // {kid, t0}
const lastMouse={x:-1,y:-1};
function greensPerLevel(L){ return Math.min(12, 1+2*L); } // 3,5,7,9,11,12,12...
function reds(){ return kids.filter(k=>k.team==='p'); }
function greens(){ return kids.filter(k=>k.team==='e'); }
function reset(){
  kids=[]; balls=[]; parts=[]; winner=null; shake=0; celebrate=0; levelKills=0; hold=null;
  const pk=['hat','whitey','crown'], psc=[1.0,.94,.98]; // SnowCraft-size kids: faces readable
  [1245,1115,985].forEach((x,i)=>kids.push(mkKid(pk[i], x, 'p', 0, psc[i]))); // reference: reds span 62-87% width, lower-right on the tilted field
  const gd = greensPerLevel(level);
  for(let i=0;i<gd;i++){
    const row = Math.floor(i/4);
    const gx = 465 - (i%4)*125 - row*55;   // reference: greens span 11-32% width, upper-left
    kids.push(mkKid('green', gx-Math.random()*30, 'e', 0, [1.0,.92,.96][i%3]));
  }
  flakes = Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.6,v:.4+Math.random()*1.2,drift:Math.random()*6.28}));
}
function kidFeet(k){ k.feet = terrainY(k.x); k.y = k.feet-30; }
function throwBall(k, power){
  const dir = k.team==='p' ? -1 : 1;
  balls.push({x:k.x+dir*8, y:k.feet-38, dir, from:k.team, power,
              phase:'rise', steps:power*2, r:6+power*.8, spin:Math.random()*6, t:0});
  k.state='toss'; k.stateT=5; sfxThrow();
}
function hittable(k){
  // authentic: only corpses/empty slots are immune (memberNum > "G recover" in the source)
  return k.alive;
}
function kidHit(k, b){
  k.hits++; k.squash=1; shake=7; sfxHit(); poof(b.x,b.y,12);
  if(k.team==='e'){
    if(k.hits>=k.maxHits){ k.alive=false; k.state='dead'; levelKills++; sfxBuried(); poof(k.x,k.feet-16,18); }
    else if(k.hits===2){ k.state='down'; k.stateT=25; }
    else { k.state='ow'; k.stateT=10; }
  } else {
    if(k.hits>=k.maxHits){ k.alive=false; k.state='dead'; sfxBuried(); poof(k.x,k.feet-16,18); }
    else { k.state='daze'; k.stateT=15; }
  }
}

// ---------- input: drag kid + hold to charge ----------
function pos(e){ const r=cv.getBoundingClientRect();
  const t = (e.changedTouches && e.changedTouches[0]) || (e.touches && e.touches[0]) || e;
  return { x:(t.clientX-r.left)*(W/r.width), y:(t.clientY-r.top)*(H/r.height) }; }
function down(e){ if(state!=='play') return; const p=pos(e);
  let best=null, bd=70;
  for(const k of reds()){ if(!k.alive || k.state!=='ready') continue;
    const d=Math.hypot(p.x-k.x, p.y-(k.y-16));
    if(d<bd){ bd=d; best=k; } }
  if(best){ hold={kid:best, t0:time}; best.state='cock'; best.stateT=999; }
  e.preventDefault(); }
function move(e){ const p=pos(e); lastMouse.x=p.x; lastMouse.y=p.y;
  if(!hold) return;
  hold.kid.x = Math.max(80, Math.min(760, p.x)); kidFeet(hold.kid);
  e.preventDefault(); }
function up(e){ if(!hold) return;
  const power = Math.max(0, Math.min(8, Math.floor((time-hold.t0)*12)));
  const k=hold.kid; hold=null;
  if(k.state==='cock'){
    if(power>=1) throwBall(k, power);
    else { k.state='ready'; k.stateT=0; }
  }
  e.preventDefault(); }
cv.addEventListener('mousedown',click); cv.addEventListener('mousedown',down); cv.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
cv.addEventListener('touchstart',click,{passive:false}); cv.addEventListener('touchstart',down,{passive:false}); cv.addEventListener('touchmove',move,{passive:false}); cv.addEventListener('touchend',up);
cv.addEventListener('click',click);

function click(e){ const p=pos(e);
  if(state==='title'){ startGame(); return; }
  if(state==='end'){ if(p.x>W/2-110&&p.x<W/2+110&&p.y>H-116&&p.y<H-72){ level=1; score=0; startGame(); } } }
function startGame(){ state='play'; audio(); try{ if(AC && AC.state==='suspended') AC.resume(); }catch(err){}
  reset(); const rot=document.getElementById('rot'); if(rot) rot.style.display='none'; }

// ---------- green AI: the original random(10) state machine ----------
function greenAI(k, ticks){
  k.clock += ticks;
  while(k.clock >= 5){ k.clock -= 5; greenTick(k); }
}
function greenTick(k){
  if(k.stateT>0){ k.stateT--; if(k.stateT>0) return; }
  switch(k.state){
    case 'ready':
      const roll = Math.random();
      if(roll<.20){ k.state='windup'; k.stateT=5; }                       // original: 3 or 4 on random(10)
      else if(roll<.30){ k.walkDir=1; k.walkSteps = 8+Math.floor(Math.random()*18); k.state='walk'; }  // advance toward the reds
      else if(roll<.40){ k.walkDir = Math.random()<.5?1:-1; k.walkSteps = 5; k.state='walk'; }            // sidestep
      break;
    case 'windup': k.state='cock'; k.stateT=5+Math.floor(Math.random()*10); break;
    case 'cock':
      throwBall(k, 5+Math.floor(Math.random()*4)); // original: random(4)+4
      break;
    case 'toss': k.state='ready'; break;
    case 'walk':
      k.x += k.walkDir*3.2;
      if(k.x > W-60) k.walkDir = -1;
      if(k.x < 60) k.walkDir = 1;
      if(k.x > 660){ k.state='windup'; k.stateT=5; }   // reached the line: set up to throw
      kidFeet(k);
      k.walkSteps--;
      if(k.walkSteps<=0 || Math.random()<.05) k.state='ready';
      break;
    case 'ow': k.state='recover'; k.stateT=5; break;
    case 'recover': k.state='ready'; break;
    case 'down': k.state='ow'; k.stateT=15; break;
    case 'daze': k.state='ready'; break;
  }
}

// ---------- update ----------
let flashMsg='', flashT=0, selfT=0;
function flash(m){ flashMsg=m; flashT=2.2; }
function update(dt){
  time+=dt;
  for(const f of flakes){ f.y+=f.v; f.x+=Math.sin(time*.8+f.drift)*.3; if(f.y>H){f.y=-4;f.x=Math.random()*W;} }
  flashT=Math.max(0,flashT-dt);
  shake=Math.max(0,shake-dt*30);
  if(state==='banner'){ bannerT-=dt; if(bannerT<=0){ state='play'; } return; }
  if(state==='celebrate'){ celebrate-=dt;
    for(const k of greens()) k.bobT += dt*6;
    if(celebrate<=0){ level++; reset(); state='banner'; bannerT=1.6; }
    return; }
  if(state!=='play') return;
  for(const k of kids){ k.bobT+=dt*3; k.squash=Math.max(0,k.squash-dt*4); }
  // kid ticks (every 5/60 s), ball ticks (every 2/60 s) — discrete like the original
  const kidTicks = dt*60, ballTicks = dt*60;
  for(const k of greens()){ if(k.alive) greenAI(k, kidTicks); }
  for(const k of reds()){ if(k.state==='toss'||k.state==='daze'){ k.stateT -= dt*12;
      if(k.stateT<=0){ k.state='ready'; } } }
  // balls: rise phase then drop phase, fixed slopes, hits during rise only (as in source)
  for(const b of balls){
    b.t += ballTicks;
    while(b.t >= 2){
      b.t -= 2;
      // authentic: rise phase (fixed slope, length = power x 2 steps), then drop (half speed)
      if(b.phase==='rise'){
        b.x += b.dir*36; b.y -= 18; b.steps--; b.spin+=.4;
        if(b.steps<=0) b.phase='drop';
      } else {
        b.x += b.dir*18; b.y += 9; b.spin+=.4;
      }
      // hit check across the flight (arc adaptation of the original's rise-crossing)
      const targets = b.from==='p' ? greens() : reds();
      for(const k of targets){
        if(!hittable(k)) continue;
        if(Math.abs(b.x-k.x) < k.w/2+6 && b.y > k.feet-k.h-10 && b.y < k.feet+6){
          kidHit(k, b); b.dead=true; break;
        }
      }
      if(b.dead) break;
      if(b.phase==='drop' && b.y >= terrainY(b.x)-2){ poof(b.x, terrainY(b.x), 10); b.dead=true; break; }
      if(b.x<-40||b.x>W+40){ b.dead=true; break; }
    }
  }
  balls = balls.filter(b=>!b.dead);
  // particles
  for(const p of parts){ p.vy+=.12; p.x+=p.vx*dt*60; p.y+=p.vy*dt*60; p.life-=dt*1.8; }
  parts = parts.filter(p=>p.life>0);
  // level flow (original Event_Loop)
  if(!greens().some(k=>k.alive) && state==='play'){
    score += levelKills; sfxWin(); state='celebrate'; celebrate=2.2;
  } else if(!reds().some(k=>k.alive) && state==='play'){
    score = (score + levelKills) * level; winner='e'; state='end'; celebrate=0;
  }
  // selftest: auto-plays like a human (drag-ish positioning + charged throws)
  if(SELFTEST){
    selfT-=dt;
    if(selfT<=0){
      selfT=.95;
      const ps=reds().filter(k=>k.alive&&k.state==='ready');
      const es=greens().filter(k=>k.alive);
      if(ps.length&&es.length){
        const k=ps[Math.floor(Math.random()*ps.length)];
        const t=es[Math.floor(Math.random()*es.length)];
        // simulate the full arc (rise + drop) to find a kid.x that splats on the target
        const sim = (x0, p) => {
          let x=x0, y=terrainY(x0)-20, steps=p*2;
          while(x>-40 && x<W+40){
            if(steps>0){ x-=36; y-=18; steps--; } else { x-=18; y+=9; }
            if(y>=terrainY(x)-2) break;
          }
          return x;
        };
        let best=null;
        for(let p=3; p<=8; p++){
          for(let x=1245; x>=980; x-=6){
            const land = sim(x, p);
            const err = Math.abs(land - t.x);
            if(err < 14 && (!best || err < best.err)) best = {x, p, err};
          }
        }
        if(best){ k.x = best.x; kidFeet(k); throwBall(k, best.p); }
      }
    }
  }
}
function poof(x,y,n){ for(let i=0;i<n;i++) parts.push({x,y,vx:(Math.random()-.5)*5,vy:-Math.random()*4-1,r:2+Math.random()*5,life:1}); }
// ---------- draw: YETI HOMELAND ----------
const stars = Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*300,r:.5+Math.random()*1.2,tw:Math.random()*6.28}));
function drawBG(){
  // SnowCraft classic daytime sky
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#9fcbe6'); sky.addColorStop(.55,'#c8deed'); sky.addColorStop(1,'#eef5fa');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
  // pale winter sun
  ctx.fillStyle='rgba(255,252,232,.95)'; ctx.beginPath(); ctx.arc(1224,84,40,0,7); ctx.fill();
  ctx.fillStyle='rgba(255,252,232,.35)'; ctx.beginPath(); ctx.arc(1224,84,58,0,7); ctx.fill();
  // back snowbank ridge — fence sits up here, BEHIND the teams (SnowCraft classic)
  ctx.fillStyle='#e8f1f9';
  ctx.beginPath(); ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=16) ctx.lineTo(x, bankY(x));
  for(let x=W;x>=0;x-=16) ctx.lineTo(x, terrainY(x));
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle='rgba(190,215,235,.55)'; ctx.lineWidth=3;
  ctx.beginPath(); for(let x=0;x<=W;x+=16){ const y=bankY(x)+2; x?ctx.lineTo(x,y):ctx.moveTo(x,y); } ctx.stroke();
  fence();
  // snow terrain
  ctx.fillStyle='#f2f8fd';
  ctx.beginPath(); ctx.moveTo(0,H);
  for(let x=0;x<=W;x+=16) ctx.lineTo(x, terrainY(x));
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  // terrain shading crest
  ctx.strokeStyle='rgba(190,215,235,.6)'; ctx.lineWidth=3;
  ctx.beginPath(); for(let x=0;x<=W;x+=16){ const y=terrainY(x)+2; x?ctx.lineTo(x,y):ctx.moveTo(x,y); } ctx.stroke();
  // crescent snow drifts flanking the middle, exactly like the reference
  drift(560); drift(880);
}
function hill(x,base,w,h,rough){
  ctx.beginPath(); ctx.moveTo(x-100,H); ctx.lineTo(x-100,base);
  for(let i=0;i<=10;i++){ ctx.quadraticCurveTo(x+(i-0.5)*(w/10), base-(i%2?h:h*.4)*rough*2, x+i*(w/10), base); }
  ctx.lineTo(x+w+100,H); ctx.closePath(); ctx.fill();
}
function tree(x,y,h,s){
  ctx.strokeStyle='#6e5a48'; ctx.lineCap='round';
  ctx.lineWidth=5*s; ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y-h); ctx.stroke();
  ctx.lineWidth=3*s;
  [[.45,.55,.5],[.7,-.6,.55],[.62,.62,.35],[.85,-.5,.3]].forEach(b=>{
    const by=y-h*b[0]; ctx.beginPath(); ctx.moveTo(x,by);
    ctx.lineTo(x+b[1]*h*.34, by-h*b[2]*.55); ctx.stroke(); });
  ctx.fillStyle='#f2f8fc';
  [[.45,1],[.7,-1]].forEach(b=>{
    const by=y-h*b[0]; ctx.beginPath();
    ctx.arc(x+b[1]*h*.17, by-h*.16, 3.4*s, 0, 7); ctx.fill(); });
}
function bankY(x){ return terrainY(x) - 92 + 10*Math.sin(x*0.004); }
function drift(x){
  const y = terrainY(x), w=64, h=30;
  ctx.fillStyle='#d7e4ee';
  ctx.beginPath(); ctx.moveTo(x-w, y+2);
  ctx.quadraticCurveTo(x, y-h, x+w, y+2); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#f4f9fd';
  ctx.beginPath(); ctx.moveTo(x-w*.6, y+1);
  ctx.quadraticCurveTo(x, y-h*.92, x+w*.6, y+1); ctx.closePath(); ctx.fill();
}
function fence(){
  const N=13;
  ctx.strokeStyle='#7c6248'; ctx.lineCap='round';
  ctx.lineWidth=7;
  [ -34, -16 ].forEach(off=>{
    ctx.beginPath(); ctx.moveTo(10, bankY(10)+off+2);
    ctx.quadraticCurveTo(W/2, bankY(W/2)+off-3, W-10, bankY(W-10)+off+2); ctx.stroke(); });
  for(let i=0;i<=N;i++){
    const px=34+i*(W-40)/N, base=bankY(px)+6, ph=46+((i*37)%9), top=base-ph;
    ctx.lineWidth=8; ctx.strokeStyle='#8a6b4f';
    ctx.beginPath(); ctx.moveTo(px,base+6); ctx.lineTo(px,top); ctx.stroke();
    ctx.fillStyle='#f4f9fd'; ctx.beginPath(); ctx.ellipse(px,top,5.5,3,0,0,7); ctx.fill();
  }
}
function drawPeaks(pts, rock, cap){
  ctx.beginPath(); ctx.moveTo(pts[0][0],H);
  for(const p of pts) ctx.lineTo(p[0],p[1]);
  ctx.lineTo(pts[pts.length-1][0],H); ctx.closePath();
  ctx.fillStyle=rock; ctx.fill();
  ctx.strokeStyle=cap; ctx.lineWidth=5; ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]);
  for(const p of pts) ctx.lineTo(p[0],p[1]);
  ctx.stroke(); ctx.lineJoin='miter';
}
function pine(x,y,s){
  ctx.fillStyle='#1e3d4d';
  for(let l=0;l<3;l++){ ctx.beginPath();
    ctx.moveTo(x, y-66*s+l*20*s); ctx.lineTo(x-16*s, y-14*s+l*20*s); ctx.lineTo(x+16*s, y-14*s+l*20*s); ctx.closePath(); ctx.fill(); }
  ctx.fillStyle='rgba(240,250,255,.85)';
  ctx.beginPath(); ctx.moveTo(x, y-66*s); ctx.lineTo(x-9*s, y-44*s); ctx.lineTo(x+9*s, y-44*s); ctx.closePath(); ctx.fill();
}
function drawCave(x,y,s){
  // dark den mouth with icy rim + icicles + inner glow
  ctx.fillStyle='#101c2c';
  ctx.beginPath(); ctx.ellipse(x,y, 52*s, 40*s, 0, 0, 7); ctx.fill();
  const glow=ctx.createRadialGradient(x,y-6,4, x,y-6, 46*s);
  glow.addColorStop(0,'rgba(140,210,255,.5)'); glow.addColorStop(1,'rgba(140,210,255,0)');
  ctx.fillStyle=glow; ctx.beginPath(); ctx.ellipse(x,y-4, 44*s, 30*s, 0, 0, 7); ctx.fill();
  ctx.strokeStyle='rgba(220,240,255,.8)'; ctx.lineWidth=3*s;
  ctx.beginPath(); ctx.ellipse(x,y, 52*s, 40*s, 0, Math.PI, 2*Math.PI); ctx.stroke();
  ctx.fillStyle='rgba(235,248,255,.95)';
  for(let i=0;i<4;i++){ const ix=x-36*s+i*24*s;
    ctx.beginPath(); ctx.moveTo(ix-4*s,y-34*s); ctx.lineTo(ix,y-34*s+(12+(i%2)*9)*s); ctx.lineTo(ix+4*s,y-34*s); ctx.closePath(); ctx.fill(); }
}
function foot(x,y,s,rot){
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot);
  ctx.fillStyle='rgba(160,190,215,.35)';
  ctx.beginPath(); ctx.ellipse(0,0,26*s,15*s,0,0,7); ctx.fill(); // big sole
  ctx.beginPath(); ctx.ellipse(-11*s,-16*s,6*s,8*s,0,0,7); ctx.fill(); // big toe
  ctx.beginPath(); ctx.ellipse(9*s,-15*s,5*s,7*s,0,0,7); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.7)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.ellipse(0,0,26*s,15*s,0,0,7); ctx.stroke();
  ctx.restore();
}
function drawPlaceholder(f){
  ctx.translate(f.x, f.feet);
  ctx.fillStyle = f.team==='p' ? '#7a5a3e' : '#3e5a6e';
  ctx.beginPath(); ctx.ellipse(0,-40,26*f.sc,34*f.sc,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(0,-64*f.sc,16*f.sc,0,7); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-5,-66,3,0,7); ctx.arc(5,-66,3,0,7); ctx.fill();
  ctx.fillStyle = f.team==='p' ? '#ffd60a' : '#ff5d5d';
  ctx.beginPath(); ctx.arc(0,-78,5,0,7); ctx.fill();
}
function drawFighter(f){
  ctx.save();
  const bob = f.alive? Math.sin(f.bobT)*2.2 : 0;
  const sq = 1 + f.squash*.18;
  const img = IMAGES[f.key];
  if(!img || (!img.ok && !img.complete)){ drawPlaceholder(f); ctx.restore(); return; }
  if(!f.alive){ // buried mound + accessory peeking out
    ctx.translate(f.x, f.feet+2);
    ctx.fillStyle='#f4f9fd'; ctx.beginPath(); ctx.ellipse(0,0,44*f.sc,26*f.sc,0,0,7); ctx.fill();
    ctx.fillStyle='#dde9f2'; ctx.beginPath(); ctx.ellipse(0,6,54*f.sc,18*f.sc,0,0,7); ctx.fill();
    ctx.drawImage(img, -img.width*.28, -img.height*.30, img.width*.56, img.height*.56);
    ctx.restore(); return;
  }
  ctx.translate(f.x, f.feet+bob);
  ctx.scale(f.face*sq, 1/sq);
  // authentic SnowCraft poses
  if(f.state==='cock'){ ctx.rotate(-.22); }
  else if(f.state==='toss'){ ctx.rotate(.28); }
  else if(f.state==='windup'){ ctx.rotate(-.16); }
  else if(f.state==='daze'){ ctx.rotate(.28*Math.sin(time*11)); }
  else if(f.state==='ow'){ ctx.scale(1,.82); ctx.rotate(-.12); }
  else if(f.state==='down'){ ctx.scale(1,.6); ctx.rotate(-.3); }
  else if(f.state==='walk'){ ctx.rotate(.07*Math.sin(time*13)); }
  if(f.tint && FILTER_OK){ ctx.filter=`hue-rotate(${f.tint}deg) saturate(1.15)`; }
  ctx.drawImage(img, -img.width*.42*f.sc, -img.height*.84*f.sc, img.width*.84*f.sc, img.height*.84*f.sc);
  if(!FILTER_OK && f.tint){ ctx.fillStyle='#ff5d5d'; ctx.beginPath();
    ctx.moveTo(0,-f.h-6); ctx.lineTo(8,-f.h-16); ctx.lineTo(0,-f.h-26); ctx.lineTo(-8,-f.h-16);
    ctx.closePath(); ctx.fill(); }
  ctx.filter='none';
  // snow buildup by damage (hits taken)
  if(f.hits>0){ ctx.fillStyle='rgba(255,255,255,.9)';
    for(let i=0;i<f.hits;i++){ ctx.beginPath(); ctx.ellipse(-12+i*14, -66*f.sc+((i*13)%14), 8, 4.5, 0, 0, 7); ctx.fill(); } }
  // hits remaining pips
  const rem = f.maxHits - f.hits;
  const pipW = 11, px0 = -(f.maxHits*pipW)/2 + pipW/2;
  ctx.fillStyle='rgba(13,27,42,.5)';
  ctx.fillRect(-(f.maxHits*pipW)/2-4, -f.h-26, f.maxHits*pipW+8, 12);
  for(let i=0;i<f.maxHits;i++){ ctx.beginPath();
    ctx.fillStyle = i<rem ? (f.team==='p'?'#7fd8ff':'#a9e34b') : 'rgba(255,255,255,.25)';
    ctx.arc(px0+i*pipW, -f.h-20, 3.8, 0, 7); ctx.fill(); }
  ctx.restore();
}
function drawAim(){
  if(state!=='play') return;
  // hover reticle over nearest ready red (the bullseye)
  let hov=null, bd=70; const r=cv.getBoundingClientRect();
  if(lastMouse.x>=0){
    for(const k of reds()){ if(!k.alive || k.state!=='ready') continue;
      const d=Math.hypot(lastMouse.x-k.x, lastMouse.y-(k.y-16));
      if(d<bd){ bd=d; hov=k; } } }
  const target = hold? hold.kid : hov;
  if(target){
    const ty = target.y-52 - 4;
    ctx.save(); ctx.translate(target.x, ty);
    ctx.strokeStyle='rgba(255,120,60,.95)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(0,0,13,0,7); ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,3,0,7); ctx.fillStyle='rgba(255,120,60,.95)'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(0,-19); ctx.lineTo(0,-9); ctx.moveTo(0,9); ctx.lineTo(0,19);
    ctx.moveTo(-19,0); ctx.lineTo(-9,0); ctx.moveTo(9,0); ctx.lineTo(19,0); ctx.stroke();
    ctx.restore();
  }
  // hold power meter 0-8 (authentic: power = hold time / 5 ticks, max 8)
  if(hold){
    const power = Math.max(0, Math.min(8, Math.floor((time-hold.t0)*12)));  // same rate as up(): ticks/5, max 8
    const k=hold.kid, bx=k.x-34, by=k.feet-70;
    ctx.fillStyle='rgba(13,27,42,.55)'; ctx.fillRect(bx-3, by-3, 10, 8*8+6);
    for(let i=0;i<8;i++){ ctx.fillStyle = i<power ? (power>=7?'#ff5d5d':(power>=4?'#ffb14d':'#7fff9e')) : 'rgba(255,255,255,.18)';
      ctx.fillRect(bx, by+i*8, 5, 6); }
  }
}
function drawBalls(){
  for(const b of balls){
    ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.spin);
    if(b.flame){
      ctx.shadowColor='rgba(255,140,40,.9)'; ctx.shadowBlur=14;
      ctx.fillStyle='#ffe3b0'; ctx.beginPath(); ctx.arc(0,0,b.r,0,7); ctx.fill();
      ctx.shadowBlur=0;
      ctx.fillStyle='rgba(255,120,30,.85)'; ctx.beginPath(); ctx.arc(0,0,b.r*.65,0,7); ctx.fill();
    } else {
      ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(0,0,b.r,0,7); ctx.fill();
      ctx.strokeStyle='#c9dcea'; ctx.lineWidth=1.6; ctx.stroke();
      ctx.fillStyle='rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(-3,-3,b.r*.35,0,7); ctx.fill();
    }
    ctx.restore();
  }
  for(const p of parts){ ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle = p.fire ? '#ffb14d' : '#fff';
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); ctx.globalAlpha=1; }
}
function drawBird(){
  if(!bird) return;
  const w = Math.sin(bird.flap)*10;
  ctx.save(); ctx.translate(bird.x,bird.y);
  ctx.fillStyle='#22303f';
  ctx.beginPath(); ctx.moveTo(-14,0); ctx.lineTo(6,-2-w*.4); ctx.lineTo(-8,-6-w); ctx.closePath(); ctx.fill(); // body-ish
  ctx.beginPath(); ctx.moveTo(-2,-2); ctx.lineTo(-16,-6-w); ctx.lineTo(-2,2+w*.5); ctx.closePath(); ctx.fill(); // wing
  ctx.beginPath(); ctx.arc(6,-2,5,0,7); ctx.fill(); // head
  ctx.fillStyle='#ffd76d'; ctx.beginPath(); ctx.moveTo(10,-2); ctx.lineTo(15,-1); ctx.lineTo(10,1); ctx.closePath(); ctx.fill(); // beak
  // carried orb
  const oc = bird.type==='flame' ? 'rgba(255,140,40,.85)' : 'rgba(255,230,90,.85)';
  ctx.shadowColor=oc; ctx.shadowBlur=12; ctx.fillStyle=oc;
  ctx.beginPath(); ctx.arc(0,12,7,0,7); ctx.fill(); ctx.shadowBlur=0;
  ctx.restore();
  for(const d of drops){
    ctx.save(); ctx.translate(d.x,d.y);
    const c = d.type==='flame' ? '#ff9640' : '#ffe65a';
    ctx.shadowColor=c; ctx.shadowBlur=14; ctx.fillStyle=c;
    ctx.beginPath(); ctx.arc(0,0,9,0,7); ctx.fill(); ctx.shadowBlur=0;
    ctx.fillStyle='rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(-3,-3,3,0,7); ctx.fill();
    ctx.restore();
  }
}
function drawSnow(){ ctx.fillStyle='rgba(255,255,255,.8)';
  for(const f of flakes){ ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,7); ctx.fill(); } }
function bigText(txt,y,size,fill){ ctx.font=`bold ${size}px 'Trebuchet MS',sans-serif`;
  ctx.textAlign='center'; ctx.lineWidth=8; ctx.strokeStyle='rgba(13,27,42,.8)';
  ctx.strokeText(txt,W/2,y); ctx.fillStyle=fill; ctx.fillText(txt,W/2,y); }
function drawTitle(){
  ctx.font="italic 26px 'Trebuchet MS',sans-serif"; ctx.textAlign='center';
  ctx.lineWidth=6; ctx.strokeStyle='rgba(13,27,42,.75)';
  ctx.strokeText('BIG ENTERTAINMENT PRESENTS',W/2,96); ctx.fillStyle='#ffd76d'; ctx.fillText('BIG ENTERTAINMENT PRESENTS',W/2,96);
  bigText("Lil Foot's SnowBall Wars", 156, 68, '#ffffff');
  ctx.font="italic 26px 'Trebuchet MS',sans-serif"; ctx.textAlign='center';
  ctx.lineWidth=6; ctx.strokeStyle='rgba(13,27,42,.75)';
  ctx.strokeText("Season's Greetings from Lil Foots",W/2,200); ctx.fillStyle='#ffd76d'; ctx.fillText("Season's Greetings from Lil Foots",W/2,200);
  ctx.font="italic 21px 'Trebuchet MS',sans-serif"; ctx.fillStyle='rgba(13,27,42,.7)'; ctx.textAlign='center';
  ctx.fillText('Bury the rival squad. Last team standing wins the hill.', W/2, 540);
  ctx.fillText('Drag a kid to move them — HOLD to power up, release to throw.', W/2, 566);
  ctx.fillText('Bury the whole rival squad to take the hill.', W/2, 592);
  bigText('CLICK TO PLAY', 630, 30, '#7fd8ff');
  ctx.font="12px sans-serif"; ctx.fillStyle='rgba(255,255,255,.65)'; ctx.textAlign='right';
  ctx.fillText(STAMP, W-10, H-10);
}
function drawBanner(){
  ctx.fillStyle='rgba(10,18,34,.35)'; ctx.fillRect(0,0,W,H);
  bigText('LEVEL '+level, 250, 72, '#ffd76d');
  ctx.font="italic 22px 'Trebuchet MS',sans-serif"; ctx.textAlign='center'; ctx.fillStyle='#e6f2fa';
  ctx.fillText(level===1 ? 'Drag a kid, HOLD to power up, release to throw.' : (greensPerLevel(level)+' rivals incoming.'), W/2, 320);
}
function drawEnd(){
  ctx.fillStyle='rgba(13,27,42,.45)'; ctx.fillRect(0,0,W,H);
  bigText(winner==='p'?'YOU WIN!':'BURIED...', 230, 70, winner==='p'?'#ffd76d':'#ffffff');
  ctx.font="italic 24px 'Trebuchet MS',sans-serif"; ctx.textAlign='center'; ctx.fillStyle='#e6f2fa';
  ctx.fillText(winner==='p'
    ? 'You out-threw the whole mountain. Legendary.'
    : 'The rival squad got you on level '+level+'. Final score: '+score, W/2, 276);
  ctx.fillStyle='rgba(255,255,255,.12)'; ctx.strokeStyle='#7fd8ff'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.rect(W/2-110,H-116,220,44); ctx.fill(); ctx.stroke();
  ctx.font="bold 26px 'Trebuchet MS',sans-serif"; ctx.fillStyle='#7fd8ff'; ctx.fillText('REMATCH', W/2, H-85);
}
function drawHUD(){
  if(state!=='play' && state!=='banner' && state!=='celebrate') return;
  ctx.font="bold 18px 'Trebuchet MS',sans-serif"; ctx.textAlign='left'; ctx.fillStyle='rgba(13,27,42,.75)';
  ctx.fillText('LEVEL '+level, 24, 40);
  ctx.textAlign='center'; ctx.fillText('SCORE '+score, W/2, 40);
  ctx.textAlign='right'; ctx.fillText(greens().filter(k=>k.alive).length+' RIVALS LEFT', W-24, 40);
}
let last=0;
function loop(ts){
  const dt=Math.min(.033,(ts-last)/1000)||.016; last=ts;
  update(dt);
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  drawBG(); for(const k of kids) drawFighter(k);
  drawBalls(); drawAim(); drawSnow();
  if(state==='title') drawTitle();
  if(state==='banner') drawBanner();
  if(state==='end') drawEnd();
  drawHUD();
  ctx.restore();
  requestAnimationFrame(loop);
}
function boot(){ window.__GAME_BOOTED=true; reset(); requestAnimationFrame(loop); }
if(SELFTEST){ setTimeout(startGame, 500); }
</script>
