<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snowball Wars - Lil Foots</title>
<style>
  html,body{margin:0;padding:0;background:#0d1b2a;height:100%;overflow:hidden;font-family:'Trebuchet MS','Verdana',sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{max-width:100vw;max-height:100vh;image-rendering:auto;border-radius:8px;box-shadow:0 0 60px rgba(120,200,255,.25);cursor:crosshair;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
  #rot{display:none;position:fixed;top:12px;left:50%;transform:translateX(-50%);background:rgba(13,27,42,.8);color:#cfe6f5;padding:8px 14px;border-radius:10px;font-size:14px;z-index:10;pointer-events:none}
  #err{display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(13,27,42,.95);color:#ffd76d;padding:16px 20px;border-radius:12px;font-size:15px;max-width:80vw;z-index:20;text-align:center;border:2px solid #ffd76d}
</style>
</head>
<body>
<div id="nojs" style="position:fixed;top:0;left:0;right:0;padding:12px;text-align:center;color:#fff;background:#c0392b;font-family:monospace;font-size:14px;z-index:99">&#9888;&#65039; If you can read this red bar, your network is blocking this page's code. Turn OFF cellular / switch to WiFi and reload. This bar disappears automatically when the game can run.</div>
<div id="wrap"><canvas id="game" width="960" height="600"></canvas></div>
<div id="rot">&#128241; Tip: rotate to landscape for the full battlefield</div>
<div id="err"></div>
<script>
document.getElementById('nojs').style.display='none';
window.__GAME_BOOTED = false;
window.addEventListener('error', function(ev){
  var d = document.getElementById('err');
  if(d){ d.style.display='block'; d.textContent = 'Something went wrong: ' + (ev.message || 'unknown error') + '. Try updating your browser.'; }
});
setTimeout(function(){
  if(!window.__GAME_BOOTED){
    var d = document.getElementById('err');
    if(d && d.style.display==='none'){ d.style.display='block'; d.style.whiteSpace='pre'; d.textContent='STILL STARTING... report:\nbooted=' + window.__GAME_BOOTED + '\nimages=' + (window.IMAGES ? Object.keys(window.IMAGES).map(function(k){return k+':' + (window.IMAGES[k].ok?'ok':(window.IMAGES[k].errored?'ERR':'...'));}).join(',') : 'none'); }
  }
}, 4000);
</script>
<script>
const SPRITES = {
  hat:   'sprite_hat.png',
  crown: 'sprite_crown.png',
  scarf: 'sprite_scarf.png'
};
const IMAGES = {};
const SPRITE_KEYS = Object.keys(SPRITES);
let bootTried = false;
function tryBoot(){ if(bootTried) return; bootTried = true; boot(); }
SPRITE_KEYS.forEach(k => {
  const img = new Image();
  img.ok = false;
  img.onload = () => { img.ok = true; if(SPRITE_KEYS.every(x=>IMAGES[x].ok)) tryBoot(); };
  if(img.complete && img.naturalWidth) { img.ok = true; if(SPRITE_KEYS.every(x=>IMAGES[x].ok || IMAGES[x].errored)) tryBoot(); }
  img.onerror = () => { img.errored = true; if(SPRITE_KEYS.every(x=>IMAGES[x].ok || IMAGES[x].errored)) tryBoot(); };
  img.src = SPRITES[k];
  IMAGES[k] = img;
});
setTimeout(tryBoot, 3500); // mobile fallback: never hang on image decode

const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const FILTER_OK = (typeof ctx.filter === 'string');
const W = 960, H = 600, GROUND = 470, G = 0.42;

// ---------- audio ----------
let AC = null;
function audio(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return AC; }
function sfxThrow(){ const ac=audio(); if(!ac) return;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type='sine'; o.frequency.setValueAtTime(680,ac.currentTime); o.frequency.exponentialRampToValueAtTime(140,ac.currentTime+.22);
  g.gain.setValueAtTime(.14,ac.currentTime); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.22);
  o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+.24); }
function sfxHit(){ const ac=audio(); if(!ac) return;
  const o=ac.createOscillator(), g=ac.createGain();
  o.type='triangle'; o.frequency.setValueAtTime(220,ac.currentTime); o.frequency.exponentialRampToValueAtTime(60,ac.currentTime+.18);
  g.gain.setValueAtTime(.3,ac.currentTime); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.2);
  o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+.22); }
function sfxBuried(){ const ac=audio(); if(!ac) return;
  [392,330,262].forEach((f,i)=>{ const o=ac.createOscillator(), g=ac.createGain();
    o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(.001,ac.currentTime+i*.12);
    g.gain.linearRampToValueAtTime(.16,ac.currentTime+i*.12+.02); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+i*.12+.3);
    o.connect(g).connect(ac.destination); o.start(ac.currentTime+i*.12); o.stop(ac.currentTime+i*.12+.32); }); }
function sfxWin(){ const ac=audio(); if(!ac) return;
  [523,659,784,1047].forEach((f,i)=>{ const o=ac.createOscillator(), g=ac.createGain();
    o.type='square'; o.frequency.value=f; g.gain.setValueAtTime(.001,ac.currentTime+i*.13);
    g.gain.linearRampToValueAtTime(.09,ac.currentTime+i*.13+.02); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+i*.13+.22);
    o.connect(g).connect(ac.destination); o.start(ac.currentTime+i*.13); o.stop(ac.currentTime+i*.13+.25); }); }

// ---------- entities ----------
function mkFighter(spriteKey, x, team, tint){
  return { key:spriteKey, x, y:GROUND-52, w:62, h:88, hp:3, team, tint, cd:0, cdMax:1.15,
           squash:0, blink:0, face: team==='p'?1:-1, alive:true, bobT:Math.random()*6.28 };
}
let fighters=[], balls=[], parts=[], flakes=[], shake=0, state='title', turnHint='', msgTimer=0;
let drag=null, winner=null, time=0;

function reset(){
  fighters = [
    mkFighter('hat',   150, 'p', 0),
    mkFighter('crown', 245, 'p', 0),
    mkFighter('scarf', 340, 'p', 0),
    mkFighter('scarf', 620, 'e', 150),
    mkFighter('hat',   715, 'e', 150),
    mkFighter('crown', 810, 'e', 150),
  ];
  // enemy tint via hue-rotate filter string
  balls=[]; parts=[]; winner=null; shake=0;
  flakes = Array.from({length:90},()=>({x:Math.random()*W,y:Math.random()*H,r:1+Math.random()*2.6,v:.4+Math.random()*1.2,drift:Math.random()*6.28}));
}
function alive(team){ return fighters.filter(f=>f.team===team && f.alive); }
function nextThrower(){
  const ps = alive('p');
  const ready = ps.filter(f=>f.cd<=0);
  if(!ready.length) return null;
  ready.sort((a,b)=>a.x-b.x);
  return ready[(nextThrower.i = ((nextThrower.i||0)+1) % ready.length), ready[(nextThrower.i)]];
}

// ---------- input ----------
function pos(e){ const r=cv.getBoundingClientRect();
  const t = (e.changedTouches && e.changedTouches[0]) || (e.touches && e.touches[0]) || e;
  return { x:(t.clientX-r.left)*(W/r.width), y:(t.clientY-r.top)*(H/r.height) }; }
function down(e){ if(state!=='play') return; const p=pos(e);
  const t=nextThrower(); if(!t){ return; } drag={t, x0:p.x, y0:p.y, x1:p.x, y1:p.y}; e.preventDefault(); }
function move(e){ if(!drag) return; const p=pos(e); drag.x1=p.x; drag.y1=p.y; e.preventDefault(); }
function up(e){
  if(!drag) return;
  const dx = drag.x0-drag.x1, dy = drag.y0-drag.y1;
  const pw = Math.min(1, Math.hypot(dx,dy)/240);
  if(pw > 0.12){
    const sp = 8 + pw*13;
    const ang = Math.atan2(dy,dx);
    balls.push({x:drag.t.x+20*Math.sign(dx||1), y:drag.t.y-58, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp,
                from:'p', r:11, spin:Math.random()*6});
    drag.t.cd = drag.t.cdMax; sfxThrow();
  }
  drag=null; e.preventDefault();
}
cv.addEventListener('mousedown',down); cv.addEventListener('mousemove',move); window.addEventListener('mouseup',up);
cv.addEventListener('touchstart',down,{passive:false}); cv.addEventListener('touchmove',move,{passive:false}); window.addEventListener('touchend',up);

function click(e){ const p=pos(e);
  if(state==='title'){ state='play'; audio(); try{ if(AC && AC.state==='suspended') AC.resume(); }catch(err){} reset(); const rot=document.getElementById('rot'); if(rot) rot.style.display='none'; return; }
  if(state==='end'){ if(p.x>W/2-110&&p.x<W/2+110&&p.y>H-116&&p.y<H-72){ state='play'; reset(); } }
}
cv.addEventListener('mousedown', click);
cv.addEventListener('touchend', (e)=>{ if(state!=='play') click(e); });

// ---------- AI ----------
function aiUpdate(dt){
  for(const f of alive('e')){
    f.cd -= dt;
    if(f.cd<=0){
      f.cd = 1.4 + Math.random()*2.2;
      const targets = alive('p'); if(!targets.length) return;
      const t = targets[Math.floor(Math.random()*targets.length)];
      const dx = t.x - f.x, dy = (t.y-58) - (f.y-58);
      const err = (Math.random()-.5)*90, err2=(Math.random()-.5)*60;
      const tx = dx+err, ty = dy+err2 - 60;
      const dist = Math.hypot(tx,ty);
      const ang = Math.atan2(ty - dist*dist*G/(2*121) , tx); // ballistic-ish
      const sp = Math.min(19, Math.max(9, dist/22));
      const v = ballistic(f.x+20, f.y-58, t.x+err*.5, t.y-58+err2*.5, sp);
      balls.push({x:f.x-20, y:f.y-58, vx:v.vx, vy:v.vy, from:'e', r:11, spin:Math.random()*6});
      sfxThrow();
    }
  }
}
function ballistic(x0,y0,x1,y1,sp){
  const dx=x1-x0, dy=y1-y0;
  const t = Math.max(18, Math.hypot(dx,dy)/sp);
  return { vx: dx/t, vy: (dy - .5*G*t*t)/t };
}

// ---------- update ----------
function update(dt){
  time+=dt;
  for(const f of flakes){ f.y+=f.v; f.x+=Math.sin(time*.8+f.drift)*.3; if(f.y>H){f.y=-4;f.x=Math.random()*W;} }
  if(state!=='play') return;
  shake=Math.max(0,shake-dt*30);
  for(const f of fighters){ f.cd=Math.max(0,f.cd-dt); f.squash=Math.max(0,f.squash-dt*4); f.bobT+=dt*3; }
  aiUpdate(dt);
  // balls
  for(const b of balls){
    b.vy+=G; b.x+=b.vx*dt*60; b.y+=b.vy*dt*60; b.spin+=.3;
    // hit check
    const targets = b.from==='p'?alive('e'):alive('p');
    for(const t of targets){
      if(Math.abs(b.x-t.x)<t.w/2 && b.y>t.y-t.h && b.y<t.y+14){
        t.hp--; t.squash=1; shake=8; sfxHit(); poof(b.x,b.y,14);
        if(t.hp<=0){ t.alive=false; sfxBuried(); poof(t.x,t.y+20,26); shake=14; }
        b.dead=true; break;
      }
    }
    if(b.y>GROUND+6){ b.dead=true; poof(b.x,GROUND,8); }
    if(b.x<-40||b.x>W+40) b.dead=true;
  }
  balls = balls.filter(b=>!b.dead);
  // parts
  for(const p of parts){ p.vy+=.12; p.x+=p.vx*dt*60; p.y+=p.vy*dt*60; p.life-=dt*1.8; }
  parts = parts.filter(p=>p.life>0);
  // win?
  if(!alive('e').length){ winner='p'; state='end'; sfxWin(); }
  else if(!alive('p').length){ winner='e'; state='end'; }
}
function poof(x,y,n){ for(let i=0;i<n;i++) parts.push({x,y,vx:(Math.random()-.5)*5,vy:-Math.random()*4-1,r:2+Math.random()*5,life:1}); }

// ---------- draw ----------
function drawBG(){
  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#8ec9e8'); sky.addColorStop(.55,'#bcdcea'); sky.addColorStop(1,'#e8f2f8');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
  // far hills
  ctx.fillStyle='#d3e4ef';
  hill(0,H-190,900,260,.28); 
  ctx.fillStyle='#c3d9e8'; hill(300,H-150,900,240,.22);
  // sun glow
  ctx.fillStyle='rgba(255,250,220,.8)'; ctx.beginPath(); ctx.arc(820,90,46,0,7); ctx.fill();
  // snow ground
  const gr=ctx.createLinearGradient(0,GROUND-60,0,H);
  gr.addColorStop(0,'#ffffff'); gr.addColorStop(1,'#dbe8f2');
  ctx.fillStyle=gr;
  ctx.beginPath(); ctx.moveTo(0,H); ctx.lineTo(0,GROUND+30);
  ctx.quadraticCurveTo(240,GROUND-24, W/2,GROUND+18);
  ctx.quadraticCurveTo(760,GROUND+52, W,GROUND+26);
  ctx.lineTo(W,H); ctx.closePath(); ctx.fill();
  // snow sparkle drifts
  ctx.fillStyle='rgba(255,255,255,.9)';
  for(let i=0;i<40;i++){ const x=(i*137)%W, y=GROUND+40+((i*53)%110); ctx.beginPath(); ctx.arc(x,y,1.5,0,7); ctx.fill(); }
}
function hill(x,base,w,h,rough){
  ctx.beginPath(); ctx.moveTo(x-100,H); ctx.lineTo(x-100,base);
  for(let i=0;i<=10;i++){ ctx.quadraticCurveTo(x+(i-0.5)*(w/10), base-(i%2?h:h*.4)*rough*2, x+i*(w/10), base); }
  ctx.lineTo(x+w+100,H); ctx.closePath(); ctx.fill();
}
function drawPlaceholder(f){
  ctx.translate(f.x, f.y+40);
  ctx.fillStyle = f.team==='p' ? '#7a5a3e' : '#3e5a6e';
  ctx.beginPath(); ctx.ellipse(0,-40,26,34,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(0,-64,16,0,7); ctx.fill();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(-5,-66,3,0,7); ctx.arc(5,-66,3,0,7); ctx.fill();
  ctx.fillStyle = f.team==='p' ? '#ffd60a' : '#ff5d5d';
  ctx.beginPath(); ctx.arc(0,-78,5,0,7); ctx.fill();
}
function drawFighter(f){
  ctx.save();
  const bob = f.alive? Math.sin(f.bobT)*2.2 : 0;
  const sq = 1 + f.squash*.18;
  const img = IMAGES[f.key];
  if(!img || (!img.ok && !img.complete)){ drawPlaceholder(f); ctx.restore(); return; }
  if(!f.alive){ // buried mound + accessory
    ctx.translate(f.x, GROUND+2);
    ctx.fillStyle='#f4f9fd'; ctx.beginPath(); ctx.ellipse(0,0,44,26,0,0,7); ctx.fill();
    ctx.fillStyle='#dde9f2'; ctx.beginPath(); ctx.ellipse(0,6,54,18,0,0,7); ctx.fill();
    // accessory peeking
    ctx.drawImage(img, -img.width*.28, -img.height*.30, img.width*.56, img.height*.56);
    ctx.restore(); return;
  }
  ctx.translate(f.x, f.y+40+bob);
  ctx.scale(f.face*sq, 1/sq);
  if(f.tint && FILTER_OK){ ctx.filter=`hue-rotate(${f.tint}deg) saturate(1.15)`; }
  ctx.drawImage(img, -img.width*.42, -img.height*.82, img.width*.84, img.height*.84);
  if(!FILTER_OK && f.tint){ // fallback team marker: red diamond above head
    ctx.fillStyle='#ff5d5d'; ctx.beginPath();
    ctx.moveTo(0,-img.height*.86-6); ctx.lineTo(8,-img.height*.86-16); ctx.lineTo(0,-img.height*.86-26); ctx.lineTo(-8,-img.height*.86-16);
    ctx.closePath(); ctx.fill(); }
  ctx.filter='none';
  // snow buildup by hp
  if(f.hp<3){ ctx.fillStyle='rgba(255,255,255,.85)';
    for(let i=0;i<(3-f.hp);i++){ ctx.beginPath(); ctx.ellipse(-14+i*16, -66+((i*13)%18), 9, 5, 0, 0, 7); ctx.fill(); } }
  // hp snowballs HUD above
  ctx.fillStyle='rgba(13,27,42,.55)';
  ctx.fillRect(-22, -img.height*.82-22, 44, 12);
  for(let i=0;i<3;i++){ ctx.beginPath();
    ctx.fillStyle = i<f.hp ? '#7fd8ff' : 'rgba(255,255,255,.25)';
    ctx.arc(-15+i*15, -img.height*.82-16, 4.4, 0, 7); ctx.fill(); }
  ctx.restore();
}
function drawAim(){
  const t = drag? drag.t : nextThrower();
  if(state!=='play') return;
  if(!drag && !t) return;
  if(t){ // marker
    const my = t.y-58 - (t.cd>0? 0:6+Math.sin(time*5)*3);
    ctx.strokeStyle='rgba(255,120,60,.9)'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(t.x-9,my-8); ctx.lineTo(t.x,my); ctx.lineTo(t.x+9,my-8); ctx.stroke();
  }
  if(drag){
    const dx=drag.x0-drag.x1, dy=drag.y0-drag.y1, pw=Math.min(1,Math.hypot(dx,dy)/240);
    if(pw>.12){
      const sp=8+pw*13, ang=Math.atan2(dy,dx);
      let vx=Math.cos(ang)*sp, vy=Math.sin(ang)*sp, x=drag.t.x+20*Math.sign(dx||1), y=drag.t.y-58;
      ctx.fillStyle='rgba(255,255,255,.85)';
      for(let i=0;i<26;i++){ vy+=G; x+=vx; y+=vy; if(i%3===0){ ctx.beginPath(); ctx.arc(x,y,2.4,0,7); ctx.fill(); } if(y>GROUND) break; }
      // power meter
      ctx.fillStyle='rgba(13,27,42,.5)'; ctx.fillRect(drag.t.x-30, drag.t.y-118, 60, 10);
      ctx.fillStyle=pw>.85?'#ff5d5d':(pw>.5?'#ffb14d':'#7fff9e'); ctx.fillRect(drag.t.x-30, drag.t.y-118, 60*pw, 10);
    }
    // drag line
    ctx.strokeStyle='rgba(255,255,255,.5)'; ctx.setLineDash([6,6]); ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(drag.x0,drag.y0); ctx.lineTo(drag.x1,drag.y1); ctx.stroke(); ctx.setLineDash([]);
  }
}
function drawBalls(){
  for(const b of balls){
    ctx.save(); ctx.translate(b.x,b.y); ctx.rotate(b.spin);
    ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(0,0,b.r,0,7); ctx.fill();
    ctx.strokeStyle='#c9dcea'; ctx.lineWidth=1.6; ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(-3,-3,b.r*.35,0,7); ctx.fill();
    ctx.restore();
  }
  for(const p of parts){ ctx.globalAlpha=Math.max(0,p.life); ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,7); ctx.fill(); ctx.globalAlpha=1; }
}
function drawSnow(){ ctx.fillStyle='rgba(255,255,255,.8)';
  for(const f of flakes){ ctx.beginPath(); ctx.arc(f.x,f.y,f.r,0,7); ctx.fill(); } }
function bigText(txt,y,size,fill){ ctx.font=`bold ${size}px 'Trebuchet MS',sans-serif`;
  ctx.textAlign='center'; ctx.lineWidth=8; ctx.strokeStyle='rgba(13,27,42,.8)';
  ctx.strokeText(txt,W/2,y); ctx.fillStyle=fill; ctx.fillText(txt,W/2,y); }
function drawTitle(){
  ctx.fillStyle='rgba(13,27,42,.35)'; ctx.fillRect(0,0,W,H);
  bigText('SNOWBALL WARS', 190, 74, '#ffffff');
  ctx.font="italic 26px 'Trebuchet MS',sans-serif"; ctx.textAlign='center';
  ctx.lineWidth=5; ctx.strokeStyle='rgba(13,27,42,.7)';
  ctx.strokeText('a Lil Foots winter showdown',W/2,232); ctx.fillStyle='#ffd76d'; ctx.fillText('a Lil Foots winter showdown',W/2,232);
  // starters preview
  const keys=['hat','crown','scarf'];
  keys.forEach((k,i)=>{ const img=IMAGES[k];
    if(img && img.ok){ ctx.drawImage(img, W/2-330+i*220 - img.width*.5, 300, img.width, img.height); }
    else { ctx.fillStyle='#7a5a3e'; ctx.beginPath(); ctx.ellipse(W/2-330+i*220, 350, 30, 42, 0, 0, 7); ctx.fill(); }
    if(i<2){ ctx.font='30px sans-serif'; ctx.fillStyle='#fff'; ctx.fillText('vs', W/2-330+i*220+110, 420); } });
  ctx.font="italic 20px 'Trebuchet MS',sans-serif"; ctx.fillStyle='#cfe6f5'; ctx.textAlign='center';
  ctx.fillText('Buried your rivals? They throw back. Last team standing wins.', W/2, 496);
  ctx.fillText('Drag BACK from your squad to lob a snowball (finger or mouse).', W/2, 522);
  bigText('CLICK TO PLAY', 570, 34, '#7fd8ff');
  ctx.font="12px sans-serif"; ctx.fillStyle='rgba(255,255,255,.65)'; ctx.textAlign='right';
  ctx.fillText('v5 gh', W-10, H-10);
}
function drawEnd(){
  ctx.fillStyle='rgba(13,27,42,.45)'; ctx.fillRect(0,0,W,H);
  bigText(winner==='p'?'YOU WIN!':'BURIED...', 230, 70, winner==='p'?'#ffd76d':'#ffffff');
  ctx.font="italic 24px 'Trebuchet MS',sans-serif"; ctx.textAlign='center'; ctx.fillStyle='#e6f2fa';
  ctx.fillText(winner==='p'?'The rival squad is under three feet of snow. Lil Foots rule the mountain.':'The rival squad got you. Rematch for pride.', W/2, 275);
  // rematch button
  ctx.fillStyle='rgba(255,255,255,.12)'; ctx.strokeStyle='#7fd8ff'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.rect(W/2-110,H-116,220,44); ctx.fill(); ctx.stroke();
  ctx.font="bold 26px 'Trebuchet MS',sans-serif"; ctx.fillStyle='#7fd8ff'; ctx.fillText('REMATCH', W/2, H-85);
}
let last=0;
function loop(ts){
  const dt=Math.min(.033,(ts-last)/1000)||.016; last=ts;
  update(dt);
  ctx.save();
  if(shake>0) ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  drawBG(); for(const f of fighters) drawFighter(f);
  drawBalls(); drawAim(); drawSnow();
  if(state==='title') drawTitle();
  if(state==='end') drawEnd();
  // HUD
  if(state==='play'){
    ctx.font="bold 18px 'Trebuchet MS',sans-serif"; ctx.textAlign='left'; ctx.fillStyle='rgba(13,27,42,.75)';
    ctx.fillText('YOUR SQUAD', 24, 40);
    ctx.textAlign='right'; ctx.fillText('RIVAL SQUAD', W-24, 40);
  }
  ctx.restore();
  requestAnimationFrame(loop);
}
function boot(){ window.__GAME_BOOTED=true; reset(); requestAnimationFrame(loop); }
